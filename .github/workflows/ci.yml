name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['pa*']

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Same commands as README "Checks". No `|| true`, no continue-on-error: each one can fail the job.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
